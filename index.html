<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Pelanggan Bengkel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --accent: #f59e0b;
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 32px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            border-bottom: 4px solid var(--accent);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Logo Proporsional */
        .logo-box {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 5px;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .header-text h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .header-text p {
            font-size: 13px;
            color: #94a3b8;
        }

        .badge-live {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .badge-live::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        form {
            padding: 36px 40px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--primary);
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eff6ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label i {
            color: #64748b;
            font-size: 13px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-dark);
            background-color: #f8fafc;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1);
        }

        input[readonly] {
            background-color: #e2e8f0;
            color: #64748b;
            cursor: not-allowed;
            font-weight: 600;
        }

        .auto-tag {
            font-size: 11px;
            background: #e0e7ff;
            color: #3730a3;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: auto;
            font-weight: 500;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.25);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .alert-box {
            display: none;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .header { padding: 24px 20px; flex-direction: column; text-align: center; gap: 16px; }
            .header-content { flex-direction: column; }
            form { padding: 24px 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-content">
            <div class="logo-box">
                <!-- Logo dari Google Drive -->
                <img id="logoPreview" src="https://lh3.googleusercontent.com/d/1GAPrkrsiup-gN5qlU4XcUlmkDuz1tDDj" alt="Logo Bengkel">
            </div>
            
            <div class="header-text">
                <h1 id="shopTitle">BANG SURYA AC</h1>
                <p>Data Service Pelanggan</p>
            </div>
        </div>
        <!-- Badge mengikuti dropdown Admin -->
        <div class="badge-live">
            <span id="badgeAdminText">-</span>
        </div>
    </div>

    <form id="customerForm">
        <div id="alertBox" class="alert-box"></div>

        <!-- Section 1: Info Transaksi & ID -->
        <div class="section-title">
            <i class="fa-solid fa-id-card"></i> Informasi Registrasi
        </div>
        <div class="form-grid">
            <div class="form-group full-width">
                <label><i class="fa-solid fa-hashtag"></i> ID Customer <span class="auto-tag">Auto Generate</span></label>
                <input type="text" id="idCustomer" name="idCustomer" placeholder="Menunggu sistem..." readonly>
            </div>
            
            <!-- Tab Dropdown Admin (Diatas Tanggal) -->
            <div class="form-group full-width">
                <label><i class="fa-solid fa-user-shield"></i> Admin / Operator</label>
                <select id="admin" name="admin" required onchange="updateBadgeAdmin(this.value)">
                    <option value="">-- Memuat Operator... --</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label><i class="fa-solid fa-calendar-day"></i> Tanggal</label>
                <input type="date" id="tanggal" name="tanggal" required>
            </div>
        </div>

        <!-- Section 2: Data Diri Pelanggan -->
        <div class="section-title">
            <i class="fa-solid fa-user"></i> Data Pelanggan
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label><i class="fa-solid fa-user-gear"></i> Nama Pelanggan</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap..." required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-layer-group"></i> Kategori Pelanggan</label>
                <select id="kategori" name="kategori" required>
                    <option value="">-- Pilih Kategori --</option>
                    <option value="Reguler">Reguler</option>
                    <option value="VIP">VIP</option>
                    <option value="Member">Member</option>
                    <option value="Corporate / Fleet">Corporate / Fleet</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> No. Handphone / WA</label>
                <input type="tel" id="noHp" name="noHp" placeholder="Contoh: 6281234567890" required>
            </div>
            <div class="form-group full-width">
                <label><i class="fa-solid fa-location-dot"></i> Alamat</label>
                <textarea id="alamat" name="alamat" placeholder="Masukkan alamat lengkap..." required></textarea>
            </div>
        </div>

        <!-- Section 3: Data Kendaraan -->
        <div class="section-title">
            <i class="fa-solid fa-car"></i> Informasi Kendaraan
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label><i class="fa-solid fa-rectangle-list"></i> No. Polisi (NOPOL)</label>
                <input type="text" id="nopol" name="nopol" placeholder="Contoh: B 1234 ABC" style="text-transform:uppercase" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-car-side"></i> Jenis Kendaraan</label>
                <input type="text" id="jenisKendaraan" name="jenisKendaraan" placeholder="Merek & Tipe (cth: Avanza Veloz / NMAX)" required>
            </div>
            <div class="form-group full-width">
                <label><i class="fa-solid fa-gauge-high"></i> KM Awal (Odometer)</label>
                <input type="number" id="kmAwal" name="kmAwal" placeholder="Contoh: 45000" required>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
            <i class="fa-solid fa-paper-plane"></i> Simpan Data Pelanggan
        </button>
    </form>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz073o1s-HuZiwMcJd1OzXb_2L1aV_zklEzPxDNYdnfQLXETB1qxH6QTlaq_sAcuLun/exec";

    // Set Default Tanggal Hari Ini
    document.getElementById('tanggal').valueAsDate = new Date();

    // Auto Update Badge Admin dari Dropdown
    function updateBadgeAdmin(val) {
        const badgeText = document.getElementById('badgeAdminText');
        badgeText.textContent = val ? val : '-';
    }

    // Ambil Daftar Admin dari Google Sheet "OPERATOR PELANGGAN"
    function loadAdminList() {
        fetch(SCRIPT_URL + "?action=getOperators")
        .then(res => res.json())
        .then(data => {
            const select = document.getElementById('admin');
            select.innerHTML = '<option value="">-- Pilih Admin / Operator --</option>';
            if(data && data.length > 0) {
                data.forEach(operator => {
                    const opt = document.createElement('option');
                    opt.value = operator;
                    opt.textContent = operator;
                    select.appendChild(opt);
                });
            }
        })
        .catch(err => {
            console.error("Gagal mengambil data admin:", err);
            const select = document.getElementById('admin');
            select.innerHTML = '<option value="">-- Gagal Memuat Data --</option>';
        });
    }

    // Load Admin saat halaman siap
    loadAdminList();

    // Generate Temporary ID preview di Frontend
    function generateTempID() {
        const date = new Date();
        const yy = String(date.getFullYear()).slice(-2);
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const rand = Math.floor(1000 + Math.random() * 9000);
        return `CUST-${yy}${mm}-${rand}`;
    }
    
    document.getElementById('idCustomer').value = generateTempID();

    // Submit Handler
    document.getElementById('customerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnSubmit');
        const alertBox = document.getElementById('alertBox');
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
        alertBox.style.display = 'none';

        const formData = {
            idCustomer: document.getElementById('idCustomer').value,
            admin: document.getElementById('admin').value,
            tanggal: document.getElementById('tanggal').value,
            nama: document.getElementById('nama').value,
            kategori: document.getElementById('kategori').value,
            noHp: document.getElementById('noHp').value,
            alamat: document.getElementById('alamat').value,
            nopol: document.getElementById('nopol').value.toUpperCase(),
            jenisKendaraan: document.getElementById('jenisKendaraan').value,
            kmAwal: document.getElementById('kmAwal').value
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(res => res.json())
        .then(response => {
            if(response.result === 'success') {
                showAlert('success', 'Data pelanggan berhasil disimpan! ID Customer: ' + response.idCustomer);
                document.getElementById('customerForm').reset();
                document.getElementById('tanggal').valueAsDate = new Date();
                document.getElementById('idCustomer').value = generateTempID();
                updateBadgeAdmin('-');
            } else {
                showAlert('error', 'Gagal menyimpan data: ' + response.error);
            }
        })
        .catch(err => {
            showAlert('error', 'Terjadi kesalahan koneksi: ' + err.message);
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Simpan Data Pelanggan';
        });
    });

    function showAlert(type, message) {
        const alertBox = document.getElementById('alertBox');
        alertBox.className = 'alert-box alert-' + type;
        alertBox.innerHTML = (type === 'success' ? '<i class="fa-solid fa-circle-check"></i> ' : '<i class="fa-solid fa-triangle-exclamation"></i> ') + message;
        alertBox.style.display = 'flex';
    }
</script>

</body>
</html>
